# Python 3.14 crashes the local dashboard during Streamlit's file-watcher
# teardown when a browser session disconnects:
#   Fatal Python error: _PySemaphore_Wakeup: parking_lot: ReleaseSemaphore
#   failed (error: 6)
# It is an interpreter-level bug (no user code in the traceback), not ours.
# Turning the watcher off avoids it; the cost is that code edits need a manual
# restart instead of auto-reloading. Streamlit Cloud runs its own Python and
# is unaffected either way.
#
# Better long-term fix: run this project on Python 3.12/3.13, which is what
# Streamlit, watchdog and Playwright are actually tested against.
[server]
fileWatcherType = "none"
